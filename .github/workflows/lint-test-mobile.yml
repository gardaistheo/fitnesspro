name: Mobile (Flutter) — Lint + Test

on:
  push:
    branches: [main, develop, feature/*, fix/*]
    paths:
      - 'mobile/**'
      - '.github/workflows/lint-test-mobile.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run Analyzer (flutter analyze)
        working-directory: ./mobile
        run: flutter analyze

      - name: Run Formatter Check (dart format)
        working-directory: ./mobile
        run: dart format --set-exit-if-changed lib test

      - name: Run Tests (flutter test) with Coverage
        working-directory: ./mobile
        run: flutter test --coverage

      - name: Check Coverage (Minimum 50%)
        working-directory: ./mobile
        run: |
          COVERAGE=$(grep -oP 'lines-valid">\K[0-9.]+' coverage/lcov.info | head -1)
          echo "Code Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "⚠️  Coverage below 50% (advisory)"
          fi

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./mobile/coverage/lcov.info
          flags: mobile
          fail_ci_if_error: false
