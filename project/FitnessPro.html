<!-- ── BLOCK 2: Theme + UI Components ── -->
<script type="text/babel">
const { useState, useEffect, useRef, useContext, createContext, useMemo } = React;

const THEMES = {
  dark: {
    bg:'#000000', surface:'#1C1C1E', surface2:'#2C2C2E', border:'#38383A',
    accent:'#C1FF4D', accentText:'#0A1406', orange:'#FF9F0A',
    text:'#FFFFFF', muted:'#8E8E93', muted2:'#AEAEB2',
    red:'#FF453A', green:'#32D74B', blue:'#0A84FF', purple:'#BF5AF2',
    tabBg:'rgba(20,20,22,0.78)',
  },
  light: {
    bg:'#F2F2F7', surface:'#FFFFFF', surface2:'#EFEFF4', border:'#E5E5EA',
    accent:'#79B31A', accentText:'#FFFFFF', orange:'#FF9500',
    text:'#1C1C1E', muted:'#8E8E93', muted2:'#6E6E73',
    red:'#FF3B30', green:'#34C759', blue:'#007AFF', purple:'#AF52DE',
    tabBg:'rgba(255,255,255,0.78)',
  },
};
const ThemeCtx = createContext(THEMES.dark);
function useTheme(){ return useContext(ThemeCtx); }

function FPBtn({children,onClick,style,variant='primary',disabled,small}){
  const C=useTheme();
  const v={
    primary:{background:C.accent,color:C.accentText},
    secondary:{background:C.surface2,color:C.text},
    ghost:{background:'transparent',color:C.accent},
    danger:{background:`${C.red}22`,color:C.red},
  };
  return <button onClick={onClick} disabled={disabled} style={{width:'100%',padding:small?'9px 16px':'14px',borderRadius:14,border:'none',cursor:disabled?'not-allowed':'pointer',fontSize:small?13:16,fontWeight:600,letterSpacing:0.1,transition:'opacity .15s',opacity:disabled?.4:1,...v[variant],...style}}>{children}</button>;
}

function ProgressBar({value,max,color,height=6}){
  const C=useTheme();
  const col=color||C.accent;
  return <div style={{background:C.surface2,borderRadius:999,height,overflow:'hidden'}}><div style={{width:`${Math.min(100,(value/max)*100)}%`,height:'100%',background:col,borderRadius:999,transition:'width .4s'}}/></div>;
}

function Chip({label,color}){
  const C=useTheme();
  const col=color||C.accent;
  return <span style={{display:'inline-block',padding:'3px 10px',borderRadius:999,fontSize:11,fontWeight:600,background:`${col}22`,color:col,letterSpacing:.2,whiteSpace:'nowrap'}}>{label}</span>;
}
function DiffChip({level}){
  const C=useTheme();
  const m={Débutant:C.green,Intermédiaire:C.orange,Avancé:C.red};
  return <Chip label={level} color={m[level]||C.muted2}/>;
}
function Card({children,style,onClick}){
  const C=useTheme();
  return <div onClick={onClick} style={{background:C.surface,borderRadius:16,padding:16,marginBottom:12,cursor:onClick?'pointer':undefined,...style}}>{children}</div>;
}
function SecTitle({children}){
  const C=useTheme();
  return <div style={{fontSize:13,fontWeight:600,color:C.muted2,marginBottom:8,marginTop:20,paddingLeft:2,textTransform:'uppercase',letterSpacing:0.2}}>{children}</div>;
}

function Segmented({options,value,onChange}){
  const C=useTheme();
  return (
    <div style={{display:'flex',background:C.surface2,borderRadius:9,padding:2,gap:2}}>
      {options.map(opt=>(
        <button key={opt} onClick={()=>onChange(opt)} style={{flex:1,padding:'6px 6px',borderRadius:7,border:'none',cursor:'pointer',fontSize:12.5,fontWeight:600,background:value===opt?C.surface:'transparent',color:value===opt?C.text:C.muted2,boxShadow:value===opt?'0 1px 3px rgba(0,0,0,0.3)':'none',transition:'all .15s'}}>{opt}</button>
      ))}
    </div>
  );
}

function BackHeader({title,onBack,rightEl}){
  const C=useTheme();
  return(
    <div style={{display:'flex',alignItems:'center',padding:'10px 6px',borderBottom:`0.5px solid ${C.border}`,flexShrink:0,background:C.bg}}>
      <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',color:C.accent,display:'flex',alignItems:'center',gap:2,padding:'6px 6px',fontSize:16.5,fontWeight:400,minWidth:70}}>
        <svg width={11} height={19} viewBox="0 0 12 20" fill="none"><path d="M10 2L2 10l8 8" stroke={C.accent} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
        Retour
      </button>
      <span style={{flex:1,textAlign:'center',fontWeight:600,fontSize:17,color:C.text}}>{title}</span>
      <div style={{minWidth:70,display:'flex',justifyContent:'flex-end'}}>{rightEl}</div>
    </div>
  );
}

function ThemeToggle(){
  const C=useTheme();
  const toDark=C.name==='light';
  return(
    <button onClick={()=>C.setTheme(toDark?'dark':'light')} style={{width:36,height:36,borderRadius:12,background:C.surface2,border:'none',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
      {toDark
        ? <svg width={16} height={16} viewBox="0 0 24 24" fill={C.text}><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        : <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke={C.text} strokeWidth={2}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>}
    </button>
  );
}

function BottomNav({screen,setScreen}){
  const C=useTheme();
  const tabs=[
    {id:'dashboard',label:'Accueil',svg:(a)=><svg width={22} height={22} viewBox="0 0 24 24" fill={a?C.accent:'none'} stroke={a?C.accent:C.muted} strokeWidth={a?2.5:1.8}><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22" fill="none" stroke={a?C.accentText:C.muted} strokeWidth={a?2:1.8}/></svg>},
    {id:'ai',label:'Coach IA',svg:(a)=><svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke={a?C.accent:C.muted} strokeWidth={a?2.5:1.8}><rect x="3" y="3" width="18" height="13" rx="4"/><path d="M8 16v2m8-2v2m-5 0h4"/><circle cx="9" cy="9.5" r="1.2" fill={a?C.accent:C.muted}/><circle cx="15" cy="9.5" r="1.2" fill={a?C.accent:C.muted}/></svg>},
    {id:'food',label:'Scanner',svg:(a)=><svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke={a?C.accent:C.muted} strokeWidth={a?2.5:1.8}><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>},
    {id:'exercises',label:'Exercices',svg:(a)=><svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke={a?C.accent:C.muted} strokeWidth={a?2.5:1.8}><path d="M6.5 6.5h11M6.5 17.5h11M4 4v16M8 8v8M16 8v8M20 4v16"/></svg>},
    {id:'workouts',label:'Séances',svg:(a)=><svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke={a?C.accent:C.muted} strokeWidth={a?2.5:1.8}><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" strokeWidth={3} strokeLinecap="round"/></svg>},
  ];
  return(
    <div style={{display:'flex',position:'relative',padding:'8px 0 8px',flexShrink:0}}>
      <div style={{position:'absolute',inset:0,background:C.tabBg,backdropFilter:'blur(20px) saturate(180%)',WebkitBackdropFilter:'blur(20px) saturate(180%)',borderTop:`0.5px solid ${C.border}`}}/>
      {tabs.map(t=>{
        const active=screen===t.id;
        return(
          <button key={t.id} onClick={()=>setScreen(t.id)} style={{flex:1,background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3,color:active?C.accent:C.muted,padding:'4px 0',position:'relative'}}>
            {t.svg(active)}
            <span style={{fontSize:10,fontWeight:active?600:400}}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}
</script>

<!-- ── BLOCK 3: Landing, Signup, Quiz, Onboarding ── -->

        <div style={{position:'absolute',top:-30,right:-30,width:110,height:110,borderRadius:'50%',background:`${C.accent}0F`}}/>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:2,color:C.accent,marginBottom:8,textTransform:'uppercase'}}>Accès illimité</div>

function SignupScreen({onBack,onDone}){
  const C=useTheme();
  const [step,setStep]=useState('form');
  const [form,setForm]=useState({name:'',email:'',password:''});
  const [card,setCard]=useState({number:'',expiry:'',cvc:''});
  const [loading,setLoading]=useState(false);
  const inp={width:'100%',background:C.surface2,border:'none',borderRadius:12,padding:'13px 14px',color:C.text,fontSize:16,boxSizing:'border-box',marginBottom:12};
  function pay(){setLoading(true);setTimeout(()=>{setLoading(false);onDone();},1800);}
  return(
    <div style={{width:'100%',height:'100%',background:C.bg,color:C.text,display:'flex',flexDirection:'column'}}>
      <BackHeader title={step==='form'?'Créer un compte':'Paiement'} onBack={step==='payment'?()=>setStep('form'):onBack}/>
      <div style={{flex:1,overflowY:'auto',padding:'24px 20px'}}>
        {step==='form'?(
          <>
            <p style={{fontSize:13,color:C.muted2,marginBottom:22}}>Rejoignez des milliers d'athlètes qui transforment leur corps.</p>
            <input style={inp} placeholder="Prénom et nom" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/>
            <input style={inp} placeholder="Adresse e-mail" type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})}/>
            <input style={inp} placeholder="Mot de passe" type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})}/>
            <FPBtn onClick={()=>setStep('payment')} disabled={!form.name||!form.email||!form.password}>Continuer vers le paiement →</FPBtn>
          </>
        ):(
          <>
            <div style={{background:C.surface,borderRadius:14,padding:16,marginBottom:20}}>
              <div style={{fontSize:12,color:C.muted2,marginBottom:4}}>Récapitulatif</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontWeight:700}}>FitnessPro Premium</span>
                <span style={{color:C.accent,fontWeight:700}}>9,99 €/mois</span>
              </div>
              <div style={{fontSize:12,color:C.muted,marginTop:4}}>7 jours d'essai gratuit inclus</div>
            </div>
            <div style={{fontSize:11,color:C.muted2,marginBottom:6,fontWeight:700,letterSpacing:.5}}>NUMÉRO DE CARTE</div>
            <input style={inp} placeholder="1234 5678 9012 3456" value={card.number} onChange={e=>setCard({...card,number:e.target.value})}/>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
              <input style={{...inp,marginBottom:0}} placeholder="MM/AA" value={card.expiry} onChange={e=>setCard({...card,expiry:e.target.value})}/>
              <input style={{...inp,marginBottom:0}} placeholder="CVC" value={card.cvc} onChange={e=>setCard({...card,cvc:e.target.value})}/>
            </div>
            <FPBtn onClick={pay} disabled={loading||!card.number||!card.expiry||!card.cvc}>{loading?'⏳ Traitement...':'🔒 Démarrer mon essai gratuit'}</FPBtn>
            <div style={{textAlign:'center',fontSize:11,color:C.muted,marginTop:10}}>Paiement sécurisé · Sans engagement</div>
          </>
        )}
      </div>
    </div>
  );
}

function QuizScreen({onDone}){
  const C=useTheme();
  const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const EQUIP=['Haltères','Barre + disques','Banc','Barre de traction','Kettlebell','Élastiques','TRX','Vélo/Rameur'];
  const [step,setStep]=useState(0);
  const [d,setD]=useState({level:null,goal:null,currentWeight:'75',targetWeight:'70',availableDays:['Lun','Mer','Ven'],hoursPerDay:1.5,location:null,equipment:[],caloriesIn:2000,caloriesOut:400});
  const set=(k,v)=>setD(p=>({...p,[k]:v}));
  const tog=(k,v)=>setD(p=>({...p,[k]:p[k].includes(v)?p[k].filter(x=>x!==v):[...p[k],v]}));
  const totalSteps=d.location==='Maison'?7:6;
  const calInStep=d.location==='Maison'?5:4;
  const calOutStep=d.location==='Maison'?6:5;
  const titles=["Quel est ton niveau ?","Quel est ton objectif ?","Tes disponibilités","Où t'entraînes-tu ?","Ton matériel","Apports caloriques","Dépenses caloriques"];
  const subs=["Sois honnête, cela personnalisera ton programme.","Définis ton poids actuel et ton objectif.","Quand es-tu disponible pour t'entraîner ?","L'endroit influence le type d'exercices proposés.","Sélectionne le matériel disponible chez toi.","Combien de calories ingères-tu en moyenne ?","Estimation hors activité sportive."];
  const stepTitleIdx=()=>{
    if(step<4)return step;
    if(d.location==='Maison'){if(step===4)return 4;if(step===5)return 5;return 6;}
    if(step===4)return 5;return 6;
  };
  const idx=stepTitleIdx();
  const canNext=()=>{
    if(step===0)return!!d.level;
    if(step===1)return!!d.goal&&d.currentWeight&&d.targetWeight;
    if(step===2)return d.availableDays.length>0;
    if(step===3)return!!d.location;
    return true;
  };
  const inp={background:C.surface2,border:'none',borderRadius:12,padding:'13px 14px',color:C.text,fontSize:16,boxSizing:'border-box',width:'100%'};
  const tagBtn=(active,onClick,children)=>(
    <button onClick={onClick} style={{padding:'7px 13px',borderRadius:10,border:`2px solid ${active?C.accent:'transparent'}`,background:active?`${C.accent}18`:C.surface2,color:active?C.accent:C.muted2,cursor:'pointer',fontWeight:600,fontSize:13}}>{children}</button>
  );
  function renderBody(){
    if(step===0)return(
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {[['🌱','Débutant','Moins de 6 mois de pratique'],['💪','Intermédiaire','6 mois à 2 ans de pratique'],['🔥','Avancé','Plus de 2 ans, maîtrise des bases']].map(([ic,lv,desc])=>(
          <button key={lv} onClick={()=>set('level',lv)} style={{padding:'16px',borderRadius:14,border:`2px solid ${d.level===lv?C.accent:'transparent'}`,background:d.level===lv?`${C.accent}18`:C.surface2,cursor:'pointer',textAlign:'left'}}>
            <div style={{fontWeight:600,fontSize:15,color:d.level===lv?C.accent:C.text}}>{ic} {lv}</div>
            <div style={{fontSize:13,color:C.muted2,marginTop:3}}>{desc}</div>
          </button>
        ))}
      </div>
    );
    if(step===1)return(
      <div>
        <div style={{display:'flex',gap:8,marginBottom:18,flexWrap:'wrap'}}>
          {['Perdre du poids','Maintenir','Prendre de la masse'].map(g=>tagBtn(d.goal===g,()=>set('goal',g),g))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div><div style={{fontSize:12,color:C.muted2,marginBottom:6,fontWeight:600}}>Poids actuel (kg)</div><input style={inp} type="number" value={d.currentWeight} onChange={e=>set('currentWeight',e.target.value)} placeholder="75"/></div>
          <div><div style={{fontSize:12,color:C.muted2,marginBottom:6,fontWeight:600}}>Poids cible (kg)</div><input style={inp} type="number" value={d.targetWeight} onChange={e=>set('targetWeight',e.target.value)} placeholder="70"/></div>
        </div>
      </div>
    );
    if(step===2)return(
      <div>
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:20}}>
          {DAYS.map(day=>tagBtn(d.availableDays.includes(day),()=>tog('availableDays',day),day))}
        </div>
        <div style={{fontSize:13,color:C.muted2,marginBottom:8,fontWeight:600}}>Durée par séance : <span style={{color:C.accent}}>{d.hoursPerDay}h</span></div>
        <input type="range" min={0.5} max={3} step={0.5} value={d.hoursPerDay} onChange={e=>set('hoursPerDay',parseFloat(e.target.value))} style={{width:'100%',accentColor:C.accent}}/>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:C.muted,marginTop:4}}><span>30 min</span><span>3h</span></div>
      </div>
    );
    if(step===3)return(
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {[['🏠','Maison','Je m\'entraîne depuis chez moi'],['🏋️','Salle','J\'ai accès à une salle équipée'],['🌳','Extérieur','Parcs, stades, espaces publics']].map(([ic,loc,desc])=>(
          <button key={loc} onClick={()=>set('location',loc)} style={{padding:'16px',borderRadius:14,border:`2px solid ${d.location===loc?C.accent:'transparent'}`,background:d.location===loc?`${C.accent}18`:C.surface2,cursor:'pointer',textAlign:'left',display:'flex',alignItems:'center',gap:14}}>
            <span style={{fontSize:26}}>{ic}</span>
            <div><div style={{fontWeight:600,fontSize:15,color:d.location===loc?C.accent:C.text}}>{loc}</div><div style={{fontSize:13,color:C.muted2}}>{desc}</div></div>
          </button>
        ))}
      </div>
    );
    if(d.location==='Maison'&&step===4)return(
      <div>
        <p style={{fontSize:13,color:C.muted2,marginBottom:14}}>Sélectionne tout le matériel dont tu disposes.</p>
        <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
          {EQUIP.map(eq=>tagBtn(d.equipment.includes(eq),()=>tog('equipment',eq),eq))}
        </div>
        <button onClick={()=>set('equipment',[])} style={{marginTop:14,background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:12}}>Aucun matériel (poids du corps uniquement)</button>
      </div>
    );
    if(step===calInStep){
      const exs=[{l:'Léger',c:1500,d:'Repas simples, peu de snacks'},{l:'Modéré',c:2000,d:'3 repas équilibrés'},{l:'Élevé',c:2500,d:'3 repas + collations'},{l:'Très élevé',c:3000,d:'Prises de masse actives'}];
      return(
        <div>
          <div style={{textAlign:'center',marginBottom:14}}><span style={{fontSize:38,fontWeight:800,color:C.accent}}>{d.caloriesIn.toLocaleString('fr-FR')}</span><span style={{fontSize:16,color:C.muted2}}> kcal</span></div>
          <input type="range" min={1200} max={4000} step={50} value={d.caloriesIn} onChange={e=>set('caloriesIn',parseInt(e.target.value))} style={{width:'100%',accentColor:C.accent,marginBottom:16}}/>
          {exs.map(ex=>(
            <button key={ex.c} onClick={()=>set('caloriesIn',ex.c)} style={{display:'flex',width:'100%',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',borderRadius:10,border:`1px solid ${d.caloriesIn===ex.c?C.accent:'transparent'}`,background:d.caloriesIn===ex.c?`${C.accent}12`:C.surface2,cursor:'pointer',marginBottom:8}}>
              <div style={{textAlign:'left'}}><div style={{fontWeight:600,fontSize:14,color:d.caloriesIn===ex.c?C.accent:C.text}}>{ex.l}</div><div style={{fontSize:12,color:C.muted}}>{ex.d}</div></div>
              <span style={{fontWeight:600,color:C.muted2}}>{ex.c} kcal</span>
            </button>
          ))}
        </div>
      );
    }
    if(step===calOutStep){
      const exs=[{l:'Sédentaire',c:200,d:'Bureau, peu de déplacements'},{l:'Modérément actif',c:400,d:'Marche quotidienne'},{l:'Actif',c:600,d:'Travail physique ou sport quotidien'},{l:'Très actif',c:900,d:'Sport intense, travail manuel'}];
      return(
        <div>
          <p style={{fontSize:13,color:C.muted2,marginBottom:12,lineHeight:1.5}}>Dépenses <strong style={{color:C.text}}>hors activité sportive</strong>. Moyenne : 300–600 kcal/jour.</p>
          <div style={{textAlign:'center',marginBottom:14}}><span style={{fontSize:38,fontWeight:800,color:C.orange}}>{d.caloriesOut.toLocaleString('fr-FR')}</span><span style={{fontSize:16,color:C.muted2}}> kcal</span></div>
          <input type="range" min={100} max={1200} step={50} value={d.caloriesOut} onChange={e=>set('caloriesOut',parseInt(e.target.value))} style={{width:'100%',accentColor:C.orange,marginBottom:16}}/>
          {exs.map(ex=>(
            <button key={ex.c} onClick={()=>set('caloriesOut',ex.c)} style={{display:'flex',width:'100%',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',borderRadius:10,border:`1px solid ${d.caloriesOut===ex.c?C.orange:'transparent'}`,background:d.caloriesOut===ex.c?`${C.orange}12`:C.surface2,cursor:'pointer',marginBottom:8}}>
              <div style={{textAlign:'left'}}><div style={{fontWeight:600,fontSize:14,color:d.caloriesOut===ex.c?C.orange:C.text}}>{ex.l}</div><div style={{fontSize:12,color:C.muted}}>{ex.d}</div></div>
              <span style={{fontWeight:600,color:C.muted2}}>{ex.c} kcal</span>
            </button>
          ))}
        </div>
      );
    }
    return null;
  }
  return(
    <div style={{width:'100%',height:'100%',background:C.bg,color:C.text,display:'flex',flexDirection:'column'}}>
      <div style={{padding:'16px 20px 12px',flexShrink:0}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
          <span style={{fontSize:12,color:C.muted2,fontWeight:600}}>Étape {step+1} sur {totalSteps}</span>
          {step>0&&<button onClick={()=>setStep(s=>s-1)} style={{background:'none',border:'none',color:C.accent,cursor:'pointer',fontSize:13}}>← Retour</button>}
        </div>
        <ProgressBar value={step+1} max={totalSteps}/>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'8px 20px 20px'}}>
        <div style={{fontWeight:800,fontSize:22,lineHeight:1.2,marginBottom:6}}>{titles[idx]}</div>
        <div style={{fontSize:13,color:C.muted2,marginBottom:22,lineHeight:1.5}}>{subs[idx]}</div>
        {renderBody()}
      </div>
      <div style={{padding:'12px 20px 20px',flexShrink:0,borderTop:`0.5px solid ${C.border}`}}>
        <FPBtn onClick={()=>{if(step<totalSteps-1)setStep(s=>s+1);else onDone(d);}} disabled={!canNext()}>
          {step===totalSteps-1?'Créer mon programme →':'Continuer →'}
        </FPBtn>
      </div>
    </div>
  );
}

function OnboardingScreen({quizData,onDone}){
  const C=useTheme();
  const [step,setStep]=useState(0);
  const slides=[
    {emoji:'🎉',title:'Ton programme est prêt !',body:`Basé sur ton profil ${quizData?.level||'Intermédiaire'}, nous avons créé un programme sur mesure pour ton objectif : ${quizData?.goal||'prendre de la masse'}.`},
    {emoji:'📊',title:'Ton dashboard personnel',body:'Retrouve toutes tes métriques en un coup d\'œil : prochain entraînement, calories, hydratation et ton streak.'},
    {emoji:'🧠',title:'Ton Coach IA',body:'Pose toutes tes questions à ton coach personnel disponible 24h/24. Nutrition, technique, motivation.'},
    {emoji:'📷',title:'Scanner ton alimentation',body:'Prends en photo ton repas et l\'IA calcule automatiquement les calories. Saisie manuelle disponible si besoin.'},
  ];
  const s=slides[step];
  return(
    <div style={{width:'100%',height:'100%',background:C.bg,color:C.text,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px 24px',textAlign:'center',boxSizing:'border-box'}}>
      <div style={{fontSize:68,marginBottom:22}}>{s.emoji}</div>
      <div style={{fontSize:24,fontWeight:800,marginBottom:14,lineHeight:1.2}}>{s.title}</div>
      <div style={{fontSize:14,color:C.muted2,lineHeight:1.7,maxWidth:280}}>{s.body}</div>
      <div style={{display:'flex',gap:8,margin:'28px 0 22px'}}>
        {slides.map((_,i)=><div key={i} style={{width:i===step?22:8,height:8,borderRadius:999,background:i===step?C.accent:C.surface2,transition:'all .3s'}}/>)}
      </div>
      <div style={{width:'100%',maxWidth:320}}>
        {step<slides.length-1?<FPBtn onClick={()=>setStep(s=>s+1)}>Suivant →</FPBtn>:<FPBtn onClick={onDone}>Accéder à mon espace →</FPBtn>}
      </div>
      {step<slides.length-1&&<button onClick={onDone} style={{marginTop:14,background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:13}}>Passer</button>}
    </div>
  );
}
</script>

<script type="text/babel">
function DashboardScreen({quizData,planning,setScreen}){
  const C=useTheme();
  const cIn=quizData?.caloriesIn||2200;
  const cBase=quizData?.caloriesOut||400;
  const cSport=320;
  const cLeft=cIn-(cBase-cSport);
  const [hydration,setHydration]=useState(1.25);
  const next=planning&&planning.length>0?planning[0]:null;
  function fmtDate(s){if(!s)return'';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
  return(
    <div style={{width:'100%',height:'100%',background:C.bg,color:C.text,display:'flex',flexDirection:'column'}}>
      <div style={{padding:'6px 20px 10px',flexShrink:0,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div><div style={{fontSize:13,color:C.muted2,fontWeight:600}}>Bonjour 👋</div><div style={{fontSize:30,fontWeight:800,letterSpacing:-0.4}}>Tableau de bord</div></div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{background:`${C.accent}22`,borderRadius:12,padding:'6px 12px'}}><span style={{fontSize:11,fontWeight:700,color:C.accent}}>🔥 12 jours</span></div>
          <ThemeToggle/>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'0 16px 16px'}}>
        {/* Streak */}
        <Card style={{background:`linear-gradient(135deg,${C.accent}20 0%,${C.surface} 65%)`}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <div style={{fontSize:11,color:C.accent,fontWeight:700,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Streak d'entraînement</div>
              <div style={{fontSize:34,fontWeight:800,lineHeight:1}}>12 <span style={{fontSize:15,color:C.muted2,fontWeight:500}}>jours consécutifs</span></div>
              <div style={{fontSize:13,color:C.muted2,marginTop:4}}>Continue comme ça ! 🚀</div>
            </div>
            <div style={{fontSize:48}}>🔥</div>
          </div>
        </Card>
        {/* Next workout */}
        <SecTitle>Prochaine séance</SecTitle>
        {next?(
          <Card onClick={()=>setScreen('planning')}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
              <div>
                <div style={{fontSize:11,color:C.muted2,marginBottom:3}}>{fmtDate(next.date)} · {next.time}</div>
                <div style={{fontSize:17,fontWeight:700}}>{next.workoutName}</div>
                <div style={{fontSize:13,color:C.muted2,marginTop:2}}>{next.muscles}</div>
              </div>
              <Chip label={`${next.duration} min`} color={C.blue}/>
            </div>
            <FPBtn small style={{width:'auto',padding:'8px 18px'}} onClick={e=>{e.stopPropagation();setScreen('planning');}}>Voir le planning →</FPBtn>
          </Card>
        ):(
          <Card><div style={{textAlign:'center',padding:'10px 0'}}><div style={{fontSize:30,marginBottom:8}}>📅</div><div style={{color:C.muted2,fontSize:14}}>Aucune séance planifiée</div><FPBtn small style={{marginTop:12,width:'auto',padding:'8px 18px'}} onClick={()=>setScreen('workouts')}>Ajouter une séance</FPBtn></div></Card>
        )}
        {/* Hydration */}
        <SecTitle>Hydratation du jour</SecTitle>
        <Card>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <div><div style={{fontSize:11,color:C.blue,fontWeight:700,letterSpacing:1,textTransform:'uppercase',marginBottom:2}}>Eau bue</div><div style={{fontSize:22,fontWeight:700}}>{hydration.toFixed(2).replace('.',',')} <span style={{fontSize:13,color:C.muted2,fontWeight:500}}>/ 2,5 L</span></div></div>
            <div style={{fontSize:34}}>💧</div>
          </div>
          <ProgressBar value={hydration} max={2.5} color={C.blue} height={8}/>
          <div style={{display:'flex',gap:8,marginTop:12}}>
            {[0.25,0.5].map(amt=><button key={amt} onClick={()=>setHydration(h=>Math.min(2.5,h+amt))} style={{flex:1,padding:'8px',borderRadius:10,border:'none',background:C.surface2,color:C.blue,cursor:'pointer',fontWeight:600,fontSize:13}}>+ {amt===0.25?'250 ml':'500 ml'}</button>)}
            <button onClick={()=>setHydration(0)} style={{padding:'8px 12px',borderRadius:10,border:'none',background:C.surface2,color:C.muted,cursor:'pointer',fontSize:13}}>↺</button>
          </div>
        </Card>
        {/* Calories */}
        <SecTitle>Suivi calorique</SecTitle>
        <Card>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <div><div style={{fontSize:11,color:C.orange,fontWeight:700,letterSpacing:1,textTransform:'uppercase',marginBottom:2}}>Calories restantes</div><div style={{fontSize:26,fontWeight:800,color:cLeft<200?C.red:C.text}}>{cLeft.toLocaleString('fr-FR')} <span style={{fontSize:13,color:C.muted2,fontWeight:500}}>kcal</span></div></div>
            <div style={{fontSize:34}}>🥗</div>
          </div>
          <ProgressBar value={cLeft} max={cIn} color={cLeft<300?C.red:C.orange} height={8}/>
          <div style={{marginTop:14,background:C.surface2,borderRadius:10,padding:'10px 12px',fontSize:12}}>
            <div style={{color:C.muted2,marginBottom:6,fontWeight:700,letterSpacing:.5}}>DÉTAIL DU CALCUL</div>
            {[['+','Apports cibles',cIn,C.green],['-','Dépenses journalières',cBase,C.red],['+','Sport du jour',cSport,C.accent]].map(([sign,label,val,color])=>(
              <div key={label} style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <span style={{color:C.muted2}}>{label}</span>
                <span style={{color,fontWeight:700}}>{sign}{val.toLocaleString('fr-FR')} kcal</span>
              </div>
            ))}
            <div style={{borderTop:`0.5px solid ${C.border}`,paddingTop:6,display:'flex',justifyContent:'space-between',fontWeight:700}}>
              <span>= Restant</span><span style={{color:C.orange}}>{cLeft.toLocaleString('fr-FR')} kcal</span>
            </div>
          </div>
          <FPBtn small variant="ghost" style={{marginTop:10}} onClick={()=>setScreen('food')}>📷 Scanner un repas</FPBtn>
        </Card>
      </div>
    </div>
  );
}

function AIScreen(){
  const C=useTheme();
  const [messages,setMessages]=useState(FP_INITIAL_CHAT);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [showHist,setShowHist]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>{if(endRef.current)endRef.current.parentElement.scrollTop=9999;},[messages]);
  async function send(){
    if(!input.trim()||loading)return;
    setMessages(m=>[...m,{role:'user',text:input}]);
    setInput('');setLoading(true);
    try{
      const r=await window.claude.complete({messages:[{role:'user',content:`Tu es CoachAI, expert en musculation et nutrition sportive. Réponds en français, de façon concise et encourageante. Question : ${input}`}]});
      setMessages(m=>[...m,{role:'assistant',text:r}]);
    }catch{setMessages(m=>[...m,{role:'assistant',text:'Désolé, réessaie dans un instant !'}]);}
    setLoading(false);
  }
  function renderTxt(t){return t.split('\n').map((l,i)=><div key={i} style={{marginBottom:l===''?5:0}} dangerouslySetInnerHTML={{__html:l.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}}/>);}
  const hist=[{id:1,txt:'Quels exercices pour le dos ?',date:"Aujourd'hui"},{id:2,txt:'Programme perte de poids',date:'Hier'},{id:3,txt:'Nutrition avant sport',date:'22 avr.'}];
  return(
    <div style={{width:'100%',height:'100%',background:C.bg,color:C.text,display:'flex',flexDirection:'column',position:'relative'}}>
      <div style={{padding:'12px 16px',borderBottom:`0.5px solid ${C.border}`,flexShrink:0,display:'flex',alignItems:'center',gap:12}}>
        <div style={{width:38,height:38,borderRadius:12,background:`${C.purple}22`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>🧠</div>
        <div style={{flex:1}}><div style={{fontWeight:700,fontSize:15}}>Coach IA</div><div style={{fontSize:11,color:C.green}}>● En ligne</div></div>
        <button onClick={()=>setShowHist(true)} style={{background:C.surface2,border:'none',borderRadius:10,padding:'6px 12px',color:C.muted2,cursor:'pointer',fontSize:12,fontWeight:600}}>Historique</button>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'14px'}}>
        {messages.map((m,i)=>(
          <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',marginBottom:10}}>
            {m.role==='assistant'&&<div style={{width:26,height:26,borderRadius:8,background:`${C.purple}22`,display:'flex',alignItems:'center',justifyContent:'center',marginRight:8,flexShrink:0,fontSize:13}}>🧠</div>}

<script type="text/babel">

  if(sel)return<ExDetail ex={sel} onBack={()=>setSel(null)}/>;
  return(

        </div>

      <div style={{flex:1,overflowY:'auto',padding:'4px 16px 16px'}}>
        {filtered.length===0&&<div style={{textAlign:'center',color:C.muted2,marginTop:40}}>Aucun exercice trouvé</div>}
        {filtered.length>0&&(
          <div style={{background:C.surface,borderRadius:14,overflow:'hidden'}}>
            {filtered.map((ex,i)=>(
              <div key={ex.id} onClick={()=>setSel(ex)} style={{display:'flex',alignItems:'center',gap:13,padding:'12px 14px',cursor:'pointer',borderBottom:i<filtered.length-1?`0.5px solid ${C.border}`:'none'}}>
                <div style={{width:38,height:38,borderRadius:10,background:`${C.accent}18`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>{icons[ex.category]||'🎯'}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:15,marginBottom:2}}>{ex.name}</div>
                  <div style={{fontSize:12,color:C.muted2}}>{ex.muscles.slice(0,2).join(' · ')}</div>
                </div>
                <DiffChip level={ex.difficulty}/>
                <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth={2}><path d="M9 18l6-6-6-6"/></svg>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function WkDetail({workout,onBack,onAdd}){
  const C=useTheme();
  return(
    <div style={{width:'100%',height:'100%',background:C.bg,color:C.text,display:'flex',flexDirection:'column'}}>

                  <div style={{fontSize:10,color:C.muted2,marginBottom:2}}>Série {j+1}</div>

function WorkoutsScreen({planning,setPlanning}){
  const C=useTheme();
  const diffs=['Tous','Débutant','Intermédiaire','Avancé'];
  const [filter,setFilter]=useState('Tous');
  const [sel,setSel]=useState(null);
  const [toast,setToast]=useState(null);
  const filtered=FP_WORKOUTS.filter(w=>filter==='Tous'||w.difficulty===filter);
  if(sel)return<WkDetail workout={sel} onBack={()=>setSel(null)} onAdd={()=>{
    const nd=new Date();nd.setDate(nd.getDate()+(planning.length*2+1));
    setPlanning(p=>[...p,{id:Date.now(),workoutId:sel.id,workoutName:sel.name,date:nd.toISOString().slice(0,10),time:'18:00',muscles:sel.muscles,duration:sel.duration}].sort((a,b)=>a.date.localeCompare(b.date)));
    setToast(sel.name);setTimeout(()=>setToast(null),2200);setSel(null);
  }}/>;
  return(
    <div style={{width:'100%',height:'100%',background:C.bg,color:C.text,display:'flex',flexDirection:'column',position:'relative'}}>
      <div style={{padding:'6px 16px 10px',flexShrink:0}}>
        <div style={{fontWeight:800,fontSize:30,letterSpacing:-0.4,marginBottom:12}}>Séances</div>
        <Segmented options={diffs} value={filter} onChange={setFilter}/>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'4px 16px 16px'}}>
        <div style={{background:C.surface,borderRadius:14,overflow:'hidden'}}>
          {filtered.map((w,i)=>(
            <div key={w.id} onClick={()=>setSel(w)} style={{padding:'12px 14px',cursor:'pointer',borderBottom:i<filtered.length-1?`0.5px solid ${C.border}`:'none'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                <span style={{fontWeight:600,fontSize:15}}>{w.name}</span>
                <DiffChip level={w.difficulty}/>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:12,color:C.muted2}}>{w.muscles} · ⏱ {w.duration} min</span>
                <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke={C.muted} strokeWidth={2}><path d="M9 18l6-6-6-6"/></svg>
              </div>
            </div>
          ))}

      </div>
      {toast&&<div style={{position:'absolute',bottom:16,left:'50%',transform:'translateX(-50%)',background:`${C.green}22`,borderRadius:12,padding:'10px 18px',color:C.green,fontWeight:700,fontSize:13,whiteSpace:'nowrap',zIndex:50}}>✓ {toast} ajouté au planning</div>}
    </div>
  );
}

function PlanningScreen({planning,setPlanning,onBack}){
  const C=useTheme();
  const [picker,setPicker]=useState(false);
  function del(id){setPlanning(p=>p.filter(x=>x.id!==id));}
  function fmtDate(s){const d=new Date(s+'T00:00:00');return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
  function until(s){const t=new Date();t.setHours(0,0,0,0);const d=new Date(s+'T00:00:00');const diff=Math.round((d-t)/86400000);if(diff===0)return"Aujourd'hui";if(diff===1)return'Demain';if(diff<0)return'Passé';return`Dans ${diff}j`;}
  const groups=[];
  planning.forEach(p=>{
    const last=groups[groups.length-1];
    if(last&&last.date===p.date)last.items.push(p);
    else groups.push({date:p.date,items:[p]});
  });
  return(
    <div style={{width:'100%',height:'100%',background:C.bg,color:C.text,display:'flex',flexDirection:'column',position:'relative'}}>
      <BackHeader title="Mon planning" onBack={onBack} rightEl={<button onClick={()=>setPicker(true)} style={{background:'none',border:'none',fontWeight:600,fontSize:16,cursor:'pointer',color:C.accent}}>+ Ajouter</button>}/>
      <div style={{flex:1,overflowY:'auto',padding:'14px'}}>
        {planning.length===0?(
          <div style={{textAlign:'center',marginTop:50}}><div style={{fontSize:44,marginBottom:14}}>📅</div><div style={{fontWeight:700,fontSize:17,marginBottom:8}}>Aucune séance planifiée</div><div style={{color:C.muted2,fontSize:13,marginBottom:20}}>Ajoute des séances depuis la bibliothèque</div><FPBtn onClick={()=>setPicker(true)}>Parcourir les séances</FPBtn></div>
        ):groups.map(g=>(
          <div key={g.date} style={{marginBottom:16}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
              <div style={{fontSize:12,color:C.muted2,fontWeight:700,textTransform:'capitalize',flex:1}}>{fmtDate(g.date)}</div>
              <Chip label={until(g.date)} color={until(g.date)==="Aujourd'hui"?C.accent:until(g.date)==='Passé'?C.muted:C.blue}/>
            </div>
            <div style={{background:C.surface,borderRadius:14,overflow:'hidden'}}>
              {g.items.map((p,i)=>(
                <div key={p.id} style={{padding:'13px',display:'flex',gap:12,alignItems:'center',borderBottom:i<g.items.length-1?`0.5px solid ${C.border}`:'none'}}>
                  <div style={{width:42,height:42,borderRadius:11,background:`${C.accent}18`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:20}}>💪</div>
                  <div style={{flex:1,minWidth:0}}><div style={{fontWeight:700,fontSize:14}}>{p.workoutName}</div><div style={{fontSize:12,color:C.muted2,marginTop:2}}>{p.time} · {p.muscles}</div><div style={{fontSize:12,color:C.muted2}}>⏱ {p.duration} min</div></div>
                  <button onClick={()=>del(p.id)} style={{background:'none',border:'none',cursor:'pointer',color:C.red,padding:6}}>
                    <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2.2}><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14H6L5,6"/><path d="M9,6V4h6v2"/></svg>
                  </button>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
      {picker&&(
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.75)',display:'flex',alignItems:'flex-end',zIndex:50}} onClick={()=>setPicker(false)}>
          <div style={{width:'100%',background:C.surface,borderRadius:'20px 20px 0 0',padding:20,maxHeight:'70%',overflowY:'auto',boxSizing:'border-box'}} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:700,fontSize:16,marginBottom:14}}>Choisir une séance</div>
            {FP_WORKOUTS.map(w=>(
              <div key={w.id} onClick={()=>{
                const nd=new Date();nd.setDate(nd.getDate()+(planning.length*2+1));
                setPlanning(p=>[...p,{id:Date.now(),workoutId:w.id,workoutName:w.name,date:nd.toISOString().slice(0,10),time:'18:00',muscles:w.muscles,duration:w.duration}].sort((a,b)=>a.date.localeCompare(b.date)));
                setPicker(false);
              }} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',background:C.surface2,borderRadius:12,marginBottom:8,cursor:'pointer'}}>
                <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{w.name}</div><div style={{fontSize:12,color:C.muted2,marginTop:2}}>{w.muscles} · {w.duration} min</div></div>
                <DiffChip level={w.difficulty}/>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
</script>

<!-- ── BLOCK 7: App Root ── -->
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "startScreen": "quiz",
  "theme": "light"
}/*EDITMODE-END*/;

function App(){
  const C=useTheme();
  const [screen,setScreen]=useState(TWEAK_DEFAULTS.startScreen);
  const [quizData,setQuizData]=useState(null);
  const [planning,setPlanning]=useState(FP_INITIAL_PLANNING);
  const mainScreens=['dashboard','ai','food','exercises','workouts'];
  const showNav=mainScreens.includes(screen);

  function renderScreen(){
    switch(screen){
      case 'landing':    return <LandingScreen onCTA={()=>setScreen('signup')}/>;
      case 'signup':     return <SignupScreen onBack={()=>setScreen('landing')} onDone={()=>setScreen('quiz')}/>;
      case 'quiz':       return <QuizScreen onDone={d=>{setQuizData(d);setScreen('onboarding');}}/>;
      case 'onboarding': return <OnboardingScreen quizData={quizData} onDone={()=>setScreen('dashboard')}/>;
      case 'dashboard':  return <DashboardScreen quizData={quizData} planning={planning} setScreen={setScreen}/>;
      case 'ai':         return <AIScreen/>;
      case 'food':       return <FoodScreen/>;
      case 'exercises':  return <ExercisesScreen/>;
      case 'workouts':   return <WorkoutsScreen planning={planning} setPlanning={setPlanning}/>;
      case 'planning':   return <PlanningScreen planning={planning} setPlanning={setPlanning} onBack={()=>setScreen('dashboard')}/>;
      default:           return <DashboardScreen quizData={quizData} planning={planning} setScreen={setScreen}/>;
    }
  }
  return(
    <IOSDevice dark={C.name==='dark'}>
      <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>
        <div key={screen} className="screen-in" style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
          {renderScreen()}
        </div>
        {showNav&&<BottomNav screen={screen} setScreen={setScreen}/>}
      </div>
    </IOSDevice>
  );
}

function TweaksPanel({visible,onClose}){
  const screens=[{id:'landing',l:'Landing'},{id:'signup',l:'Inscription'},{id:'quiz',l:'Quiz'},{id:'onboarding',l:'Onboarding'},{id:'dashboard',l:'Dashboard'},{id:'ai',l:'Coach IA'},{id:'food',l:'Scanner'},{id:'exercises',l:'Exercices'},{id:'workouts',l:'Séances'},{id:'planning',l:'Planning'}];
  if(!visible)return null;
  function setTweak(edits){
    window.parent.postMessage({type:'__edit_mode_set_keys',edits},'*');
    setTimeout(()=>window.location.reload(),100);
  }
  return(
    <div style={{position:'fixed',bottom:20,right:20,background:'#1C1C2A',border:'1px solid #252538',borderRadius:16,padding:20,zIndex:1000,width:250,boxShadow:'0 20px 60px rgba(0,0,0,.8)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <span style={{fontWeight:800,fontSize:15,color:'#F0F0F8'}}>Tweaks</span>
        <button onClick={onClose} style={{background:'none',border:'none',color:'#5A5A78',cursor:'pointer',fontSize:20,lineHeight:1}}>×</button>
      </div>
      <div style={{fontSize:11,color:'#5A5A78',fontWeight:700,letterSpacing:1,marginBottom:8,textTransform:'uppercase'}}>Thème</div>
      <div style={{display:'flex',gap:6,marginBottom:16}}>
        {[['dark','Sombre'],['light','Clair']].map(([t,l])=>(
          <button key={t} onClick={()=>setTweak({theme:t})} style={{flex:1,padding:'8px 10px',borderRadius:8,border:'1px solid #252538',background:TWEAK_DEFAULTS.theme===t?'#C1FF4D22':'#141420',color:TWEAK_DEFAULTS.theme===t?'#C1FF4D':'#8A8AAA',cursor:'pointer',fontSize:12,fontWeight:600}}>{l}</button>
        ))}
      </div>
      <div style={{fontSize:11,color:'#5A5A78',fontWeight:700,letterSpacing:1,marginBottom:8,textTransform:'uppercase'}}>Écran de démarrage</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
        {screens.map(s=>(
          <button key={s.id} onClick={()=>setTweak({startScreen:s.id})} style={{padding:'7px 10px',borderRadius:8,border:'1px solid #252538',background:TWEAK_DEFAULTS.startScreen===s.id?'#C1FF4D22':'#141420',color:TWEAK_DEFAULTS.startScreen===s.id?'#C1FF4D':'#8A8AAA',cursor:'pointer',fontSize:12,fontWeight:600,textAlign:'left'}}>
            {s.l}
          </button>
        ))}
      </div>
    </div>
  );
}

function Root(){
  const [theme,setTheme]=useState(TWEAK_DEFAULTS.theme||'dark');
  const [tweaks,setTweaks]=useState(false);
  useEffect(()=>{
    const h=(e)=>{
      if(e.data?.type==='__activate_edit_mode')setTweaks(true);
      if(e.data?.type==='__deactivate_edit_mode')setTweaks(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',h);
  },[]);
  const ctxValue=useMemo(()=>({...THEMES[theme],name:theme,setTheme}),[theme]);
  return(
    <ThemeCtx.Provider value={ctxValue}>
      <App/>
      <TweaksPanel visible={tweaks} onClose={()=>{setTweaks(false);window.parent.postMessage({type:'__edit_mode_dismissed'},'*');}}/>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
