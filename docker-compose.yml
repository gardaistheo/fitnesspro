services:
  postgres:
    image: postgres:15-alpine
    container_name: fitnesspro_postgres
    environment:
      POSTGRES_USER: fitnesspro
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fitnesspro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - fitnesspro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitnesspro -d fitnesspro']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitnesspro_backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    ports:
      - '8000:8000'
    networks:
      - fitnesspro

volumes:
  postgres_data:
    driver: local

networks:
  fitnesspro:
    driver: bridge
