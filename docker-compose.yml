version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fitnesspro_postgres
    environment:
      POSTGRES_USER: fitnesspro_user
      POSTGRES_PASSWORD: fitnesspro_password
      POSTGRES_DB: fitnesspro_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - fitnesspro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitnesspro_user -d fitnesspro_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitnesspro_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fitnesspro_dev
      DB_USERNAME: fitnesspro_user
      DB_PASSWORD: fitnesspro_password
    volumes:
      - ./backend:/app
      - /app/vendor
      - /app/node_modules
    ports:
      - '8000:8000'
    networks:
      - fitnesspro
    command: >
      sh -c "composer install &&
             php artisan migrate:fresh --seed &&
             php -S 0.0.0.0:8000 -t public"

volumes:
  postgres_data:
    driver: local

networks:
  fitnesspro:
    driver: bridge
